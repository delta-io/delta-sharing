name: Bot configuration checks
on:
  pull_request:
    paths:
      - '.bot/**'
      - '.github/CODEOWNERS'
      - '.github/actions/setup-bot-*/**'
      - '.github/scripts/*bot*'
      - '.github/tests/**'
      - '.github/workflows/*bot*.yml'
  push:
    branches: [main]
    paths:
      - '.bot/**'
      - '.github/CODEOWNERS'
      - '.github/actions/setup-bot-*/**'
      - '.github/scripts/*bot*'
      - '.github/tests/**'
      - '.github/workflows/*bot*.yml'
permissions:
  contents: read
jobs:
  configuration:
    # Fork code may run here: hosted, no secrets/OIDC/private engine or shared VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; same pin as bot workflows
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -I -m pip install --only-binary=":all:" PyYAML==6.0.3
      - name: Check onboarding controls without credentials
        run: |
          python -I -m unittest discover -s .github/tests -v
          for script in .github/scripts/*bot*.sh; do bash -n "$script"; done
