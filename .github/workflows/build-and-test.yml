name: Build and Test
on:
  pull_request:
  push:
    branches:
      - main
      - 'branch-*'
      - 'python-branch-*'
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-test-server:
    runs-on: ubuntu-24.04
    env:
      SPARK_LOCAL_IP: localhost
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_service_account_key.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Cache Scala, SBT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2
            ~/.cache/coursier
          key: build-and-test-server
      - name: Install Java 8
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '8'
      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_TEST_ACCOUNT_KEY: ${{ secrets.AZURE_TEST_ACCOUNT_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: ./build/sbt server/test

  build-and-test-client-scala-2_13:
    runs-on: ubuntu-24.04
    env:
      SPARK_LOCAL_IP: localhost
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_service_account_key.json
      # Required by OpenSharing (AWS SDK v2) when signing S3 URLs for shared tables.
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Cache Scala, SBT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2
            ~/.cache/coursier
          key: build-and-test-client-scala-2_13
      - name: Install Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '17'
      # Build OpenSharing from git and install it into the local Maven repository, where the
      # build's mavenLocal resolver picks it up, before tests so the Maven downloads are not
      # charged against the 180s server-startup wait the integration tests use. TEMPORARY:
      # pinned until OpenSharing releases the fixes the tests need; then depend on the release
      # and drop this step.
      - name: Build OpenSharing from git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: OpenSharing-IO/OpenSharing
          ref: 958fccd0247a1c3de1ca9d3667022ea8496fb518 # ci/delta-sharing-1040-integration
          path: opensharing
      - name: Install OpenSharing jar for sbt
        run: |
          mvn -q -f opensharing/server/pom.xml -DskipTests package
          mkdir -p opensharing-test-server/lib
          cp opensharing/server/opensharing-server/target/opensharing-server-*-exec.jar             opensharing-test-server/lib/

      - name: Resolve OpenSharing test server
        run: ./build/sbt opensharingTestServer/update opensharingTestServer/compile
      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_TEST_ACCOUNT_KEY: ${{ secrets.AZURE_TEST_ACCOUNT_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: ./build/sbt client/test spark/test

  build-and-test-client-scala-2_12:
    runs-on: ubuntu-24.04
    env:
      SPARK_LOCAL_IP: localhost
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_service_account_key.json
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Cache Scala, SBT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2
            ~/.cache/coursier
          key: build-and-test-client-scala-2_12
      - name: Install Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '17'
      # Build OpenSharing from git and install it into the local Maven repository, where the
      # build's mavenLocal resolver picks it up. TEMPORARY: pinned until OpenSharing releases
      # the fixes the integration tests need; then depend on the release and drop this step.
      - name: Build OpenSharing from git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: OpenSharing-IO/OpenSharing
          ref: 958fccd0247a1c3de1ca9d3667022ea8496fb518 # ci/delta-sharing-1040-integration
          path: opensharing
      - name: Install OpenSharing jar for sbt
        run: |
          mvn -q -f opensharing/server/pom.xml -DskipTests package
          mkdir -p opensharing-test-server/lib
          cp opensharing/server/opensharing-server/target/opensharing-server-*-exec.jar             opensharing-test-server/lib/

      - name: Resolve OpenSharing test server
        run: ./build/sbt ++2.12.18 opensharingTestServer/update opensharingTestServer/compile
      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_TEST_ACCOUNT_KEY: ${{ secrets.AZURE_TEST_ACCOUNT_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: ./build/sbt ++2.12.18 client/test

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      SPARK_LOCAL_IP: localhost
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/google_service_account_key.json
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Cache Scala, SBT
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.sbt
            ~/.ivy2
            ~/.cache/coursier
          key: build-and-test-python
      - name: Install Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Python and uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd python
          uv sync --frozen
      # Build OpenSharing from git and install it into the local Maven repository, where the
      # build's mavenLocal resolver picks it up. TEMPORARY: pinned until OpenSharing releases
      # the fixes the integration tests need; then depend on the release and drop this step.
      - name: Build OpenSharing from git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: OpenSharing-IO/OpenSharing
          ref: 958fccd0247a1c3de1ca9d3667022ea8496fb518 # ci/delta-sharing-1040-integration
          path: opensharing
      - name: Install OpenSharing jar for sbt
        run: |
          mvn -q -f opensharing/server/pom.xml -DskipTests package
          mkdir -p opensharing-test-server/lib
          cp opensharing/server/opensharing-server/target/opensharing-server-*-exec.jar             opensharing-test-server/lib/

      - name: Resolve OpenSharing test server
        run: ./build/sbt opensharingTestServer/update opensharingTestServer/compile
      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AZURE_TEST_ACCOUNT_KEY: ${{ secrets.AZURE_TEST_ACCOUNT_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          cd python
          uv run dev/lint-python
          uv run dev/pytest
