[package]
name = "delta-kernel-rust-sharing-wrapper"
edition = "2021"
license = "Apache-2.0"
version = "0.3.3"

[lib]
name = "delta_kernel_rust_sharing_wrapper"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "57", features = ["pyarrow"] }
# `gcp`/`aws`/`azure` are enabled explicitly so the cloud builders (e.g. GoogleCloudStorageBuilder)
# are available for directory-based access, not just the string-keyed `parse_url_opts` path.
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
delta_kernel = { version = "0.22.0", features = ["default-engine-rustls", "arrow-57"]}
url = "2"

[dependencies.pyo3]
version = "0.26.0"
# "abi3-py310" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.10
features = ["abi3-py310"]
